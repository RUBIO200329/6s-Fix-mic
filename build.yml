name: Build MicSelect

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks/iPhoneOS15.2.sdk" "$HOME/theos/sdks/" || true

      - name: Verify toolchain
        run: |
          export THEOS="$HOME/theos"
          make --version
          test -d "$THEOS/sdks/iPhoneOS15.2.sdk"

      - name: Build Debian package
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          make clean
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: MicSelect-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MicSelect-build-logs
          path: |
            packages/*
            .theos/log/*
          if-no-files-found: ignore
